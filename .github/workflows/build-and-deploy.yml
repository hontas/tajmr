name: Build and Deploy

on:
  # every merge to main that can change the built site goes live. If you add a new file that
  # affects the build (config, tooling), add it here too.
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '!client/**/*.test.*'
      - package.json
      - package-lock.json
      - vite.config.mjs
      - pwa-assets.config.mjs
      - .nvmrc
      - .github/workflows/build-and-deploy.yml
  # manual run, e.g. to redeploy after changing a setting
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # SENTRY_AUTH_TOKEN is an environment secret: only this job on main can read it
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      # Calendar version: YYYY.MM.DD, plus .N from the second deploy of the same (UTC) day.
      # Counted from the v* tags, which the tag job creates after a successful deploy.
      - name: Compute version
        id: version
        run: |
          git fetch --tags --force --quiet origin
          today=$(date -u +%Y.%m.%d)
          count=$(git tag --list "v${today}" "v${today}.*" | wc -l)
          if [ "$count" -eq 0 ]; then version="$today"; else version="${today}.$((count + 1))"; fi
          echo "Deploying version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci --coverage

      - name: Build 🔧
        run: npm run build
        env:
          # navbar + Sentry release (see vite.config.mjs)
          APP_VERSION: ${{ steps.version.outputs.version }}
          # Sentry source map upload (see vite.config.mjs); the build fails if a value is missing
          SENTRY_UPLOAD: true
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      # The maps were uploaded to Sentry during the build; never publish the original source
      - name: Remove source maps from the site
        run: |
          find dist -name '*.map' -delete
          if [ -n "$(find dist -name '*.map')" ]; then echo "source maps left in dist/"; exit 1; fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5

  # Only after a successful deploy, so failed deploys don't use up a version number.
  # The tags also mark which commit each deploy came from (handy for rollbacks).
  tag:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the deployed commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "v${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"
